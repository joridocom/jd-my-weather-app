<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Info</title>
  <!-- Link to our custom CSS file -->
  <link rel="stylesheet" href="css/output.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <!-- Title will be set dynamically -->
    <h1 id="app-title" class="text-3xl font-bold mb-6 text-center"></h1>
    
    <!-- Weather cards container -->
    <div id="weather-container" class="flex flex-col md:flex-row gap-6">
      <!-- Weather cards will be injected here -->
    </div>

    <!-- Refresh Button -->
    <div class="flex justify-center">
      <button id="refresh-btn" class="mt-6 px-8 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        <!-- Button text will be set dynamically -->
      </button>
    </div>
  </div>

  <!-- Link to our custom JavaScript file -->
  <script src="js/script.js"></script>
</body>
</html>
