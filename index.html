<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-container">
    <!-- Weather card for Tokyo -->
    <div class="weather-card">
      <h2 class="location">Tokyo, Japan</h2>
      <p class="timestamp">As of <span id="tokyo-time">--:-- -- JST</span></p>
      <div class="temperature">
        <span id="tokyo-temp">--</span>°
      </div>
      <p class="description" id="tokyo-desc">--</p>
      <p class="high-low">Day <span id="tokyo-day">--</span>° • Night <span id="tokyo-night">--</span>°</p>
      <div class="advisory" id="tokyo-advisory">No advisories</div>
    </div>

    <!-- Weather card for Nasushiobara -->
    <div class="weather-card">
      <h2 class="location">Nasushiobara, Japan</h2>
      <p class="timestamp">As of <span id="nasu-time">--:-- -- JST</span></p>
      <div class="temperature">
        <span id="nasu-temp">--</span>°
      </div>
      <p class="description" id="nasu-desc">--</p>
      <p class="high-low">Day <span id="nasu-day">--</span>° • Night <span id="nasu-night">--</span>°</p>
      <div class="advisory" id="nasu-advisory">No advisories</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
